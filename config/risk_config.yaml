# ============================================================
# Traffic Mortality ML — Central Configuration
# ============================================================

# --- Data Sampling ---
data:
  us_accidents_sample_size: 500000  # Set to null for full dataset
  uk_stats19_year: 2023
  random_seed: 42
  test_size: 0.15
  val_size: 0.15

# --- Severity Mapping ---
severity:
  # US Accidents: 1-4 (traffic delay impact) -> unified labels
  us_mapping:
    1: "Minor"
    2: "Minor"
    3: "Serious"
    4: "Fatal"
  # UK STATS19: 1-3 (injury severity)
  uk_mapping:
    1: "Fatal"
    2: "Serious"
    3: "Minor"
  # Unified labels (order matters for ordinal encoding)
  labels: ["Minor", "Serious", "Fatal"]

# --- Risk Scoring ---
risk:
  weights:
    severity_probability: 0.40
    temporal_risk: 0.20
    environmental_risk: 0.20
    geographic_density: 0.20
  categories:
    low: [0, 30]
    moderate: [31, 60]
    high: [61, 80]
    critical: [81, 100]

# --- Model Training ---
models:
  logistic_regression:
    max_iter: 1000
    class_weight: "balanced"
    solver: "lbfgs"
  random_forest:
    n_estimators: 200
    max_depth: 20
    class_weight: "balanced"
    n_jobs: -1
  xgboost:
    n_estimators: 200
    max_depth: 8
    learning_rate: 0.1
    eval_metric: "mlogloss"
    n_jobs: -1
  lightgbm:
    n_estimators: 200
    max_depth: 8
    learning_rate: 0.1
    is_unbalance: true
    n_jobs: -1
    verbose: -1

# --- SMOTE ---
smote:
  sampling_strategy: "auto"
  k_neighbors: 5
  random_state: 42

# --- Hotspot Detection ---
hotspots:
  kmeans:
    n_clusters: 20
    random_state: 42
  dbscan:
    eps_km: 5.0          # Radius in kilometers
    min_samples: 10
  kde:
    bandwidth: 0.01      # Degrees (approx ~1km)
    grid_resolution: 200  # Grid points per axis

# --- Explainability ---
explainability:
  shap_max_samples: 1000  # Limit for SHAP computation speed
  lime_num_features: 10
